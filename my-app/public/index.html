<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>佳佳雨的穿搭 · 主视图（mock 数据版）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #faf7f2; color: #3d3229; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 24px 16px 60px; }
  header { text-align: center; padding: 12px 0 18px; }
  header h1 { font-size: 26px; letter-spacing: 2px; }
  header p { color: #a08c78; margin-top: 6px; font-size: 14px; }

  /* 状态切换条（仅演示用，方便逐个截图四种状态） */
  .switcher { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
              padding: 10px 0 20px; }
  .switcher button { border: 1px solid #d8cabb; background: #fff; color: #6b5a49;
                     border-radius: 999px; padding: 6px 16px; font-size: 13px; cursor: pointer;
                     font-family: inherit; }
  .switcher button.on { background: #c96f4a; color: #fff; border-color: #c96f4a; }

  .toolbar { text-align: center; margin-bottom: 18px; }
  .btn { display: inline-block; background: #c96f4a; color: #fff; border: none; border-radius: 8px;
         padding: 10px 22px; font-size: 15px; text-decoration: none; cursor: pointer; font-family: inherit; }

  /* ===== 卡片组件（可复用）===== */
  .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px;
          box-shadow: 0 1px 4px rgba(90,70,50,.08); display: flex; gap: 14px; align-items: center; }
  .card .thumb { width: 56px; height: 56px; border-radius: 10px; flex: 0 0 56px;
                 display: flex; align-items: center; justify-content: center;
                 font-size: 22px; background: #f5ece3; }
  .card .info { flex: 1; min-width: 0; }
  .card .who { font-weight: 500; font-size: 15px; }
  .card .match { margin-top: 4px; font-size: 14px; color: #6b5a49; }
  .card .match b { color: #c96f4a; font-weight: 500; }
  .card .time { color: #b3a493; font-size: 12px; margin-top: 6px; }

  /* ===== 状态一：加载中（骨架屏）===== */
  .skeleton .thumb { background: #efe7dd; }
  .sk-line { height: 12px; border-radius: 6px; background: #efe7dd; margin-top: 8px; }
  .sk-line.short { width: 40%; }
  @keyframes pulse { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
  @media (prefers-reduced-motion: no-preference) {
    .skeleton { animation: pulse 1.4s ease-in-out infinite; }
  }
  .loading-tip { text-align: center; color: #a08c78; font-size: 14px; margin-top: 6px; }

  /* ===== 状态二：空 ===== */
  .empty { text-align: center; color: #a08c78; padding: 56px 0; }
  .empty .big { font-size: 40px; margin-bottom: 12px; color: #d8cabb; }

  /* ===== 状态三：错误 ===== */
  .error-box { background: #fff; border-radius: 12px; padding: 40px 20px; text-align: center;
               box-shadow: 0 1px 4px rgba(90,70,50,.08); }
  .error-box .msg { color: #b3261e; font-size: 15px; margin-bottom: 6px; }
  .error-box .hint { color: #a08c78; font-size: 13px; margin-bottom: 18px; }
  .btn.ghost { background: transparent; color: #c96f4a; border: 1px solid #c96f4a; }

  footer { text-align: center; color: #b3a493; font-size: 12px; padding-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>佳佳雨的穿搭</h1>
    <p>每天早上，直接看别人的搭配答案</p>
  </header>

  <div class="switcher">
    <button data-state="normal">正常</button>
    <button data-state="loading">加载中</button>
    <button data-state="empty">空</button>
    <button data-state="error">错误</button>
  </div>

  <div class="toolbar"><button class="btn" id="publishBtn">＋ 发布穿搭</button></div>

  <main id="view"></main>

  <footer>Day 8 · mock 数据版（真实数据版跑在 3000 端口）</footer>
</div>

<script>
// ===== 本地假数据（今天不接真实接口，第 3 周再接）=====
const MOCK_OUTFITS = [
  { id: 1, nickname: "佳佳雨",  top_item: "白色宽松衬衫", bottom_item: "浅蓝直筒牛仔裤", note: "卷个袖口更精神", time: "2026-09-23 08:10", icon: "👕" },
  { id: 2, nickname: "小雨",    top_item: "米色针织开衫", bottom_item: "深灰阔腿裤",     note: "上浅下深，显高", time: "2026-09-23 07:45", icon: "🧥" },
  { id: 3, nickname: "阿May",   top_item: "黑色高领毛衣", bottom_item: "卡其直筒裤",     note: "冷天也能利落",   time: "2026-09-22 21:30", icon: "🧶" },
  { id: 4, nickname: "佳佳雨",  top_item: "条纹长袖T",    bottom_item: "白色休闲裤",     note: "周末遛弯刚好",   time: "2026-09-22 19:02", icon: "👚" },
];

// ===== 可复用卡片组件：一条穿搭 = 一张卡片 =====
function OutfitCard(item) {
  return `
    <div class="card">
      <div class="thumb">${item.icon || "👕"}</div>
      <div class="info">
        <div class="who">${item.nickname}</div>
        <div class="match">上衣 <b>${item.top_item}</b> ＋ 裤子 <b>${item.bottom_item}</b></div>
        <div class="time">${item.time}</div>
      </div>
    </div>`;
}

// ===== 四种页面状态 =====
const states = {
  // 一、加载中：骨架屏占位
  loading() {
    const sk = Array.from({ length: 3 }).map(() => `
      <div class="card skeleton">
        <div class="thumb"></div>
        <div class="info">
          <div class="sk-line short"></div>
          <div class="sk-line"></div>
        </div>
      </div>`).join("");
    return sk + `<div class="loading-tip">正在加载穿搭…</div>`;
  },

  // 二、空：一条都没有
  empty() {
    return `<div class="empty">
      <div class="big">○</div>
      还没有穿搭，来发第一条吧
    </div>`;
  },

  // 三、错误：加载失败
  error() {
    return `<div class="error-box">
      <div class="msg">加载失败了，没能拿到穿搭数据</div>
      <div class="hint">可能是网络不太稳定，稍等一下再试</div>
      <button class="btn ghost" id="retryBtn">重新加载</button>
    </div>`;
  },

  // 四、正常：卡片列表（用可复用组件渲染每条）
  normal() {
    return MOCK_OUTFITS.map(OutfitCard).join("");
  },
};

const view = document.getElementById("view");
const buttons = document.querySelectorAll(".switcher button");

function render(state) {
  view.innerHTML = states[state] ? states[state]() : states.normal();
  buttons.forEach((b) => b.classList.toggle("on", b.dataset.state === state));
  const retry = document.getElementById("retryBtn");
  if (retry) retry.onclick = () => render("loading");
}

buttons.forEach((b) => (b.onclick = () => render(b.dataset.state)));
document.getElementById("publishBtn").onclick = () =>
  alert("发布功能在真实数据版里（http://localhost:3000/new）");

render("normal");
</script>
</body>
</html>
